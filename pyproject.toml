[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", "out"]

[tool.ruff.lint]
# F: real bugs (undefined names, unused imports).
# E/W: pycodestyle, with stylistic-only rules dropped (E501 line length,
# E702 intentional terse `a; b` pairs, E741 `l` matches the engine's
# layout-loop convention -- see CLAUDE.md "Building-bake architecture").
# I: import sorting (subsumes isort).
# UP: pyupgrade -- modernise typing.Optional, quoted annotations, etc.
# B: flake8-bugbear -- real bug classes (B905 silent zip truncation,
# B007 unused loop vars hinting at typos).
# PLE: pylint error subset -- bad super calls, format string
# mismatches, return in __init__.
# PLC0415: import-outside-top-level -- lazy imports hide import
# errors until execution path is hit and scatter the dep graph
# across function bodies.  Heavy-dep avoidance belongs in module
# splits or `try/except ImportError` at top, not in-body imports.
# NPY: numpy correctness -- legacy np.random, numpy-2 deprecations.
# RUF100: unused noqa directives (the rest of the RUF group is mostly
# stylistic against this codebase's conventions -- `×` in docstrings,
# `_list_field()` dataclass factory, class-level constant lists).
# A: flake8-builtins -- shadowing list/type/id as parameter or local.
select = ["F", "E", "W", "I", "UP", "B", "PLE", "PLC0415", "NPY", "RUF100", "A"]
ignore = ["E501", "E702", "E741"]

[tool.ruff.lint.isort]
# Preserve the codebase's existing dense multi-symbol-per-line imports
# (`from .way import (HEX_CORNERS, HEX_EDGES, edge_midpoint, ...)`) instead
# of expanding to one symbol per line on every trailing comma.
combine-as-imports = true
split-on-trailing-comma = false
