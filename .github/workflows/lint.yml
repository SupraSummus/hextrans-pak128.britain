name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install ruff
      - run: ruff check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install numpy Pillow
      - run: python3 -m unittest discover -s tests -v

  rebake:
    # Re-runs every kind of asset baker — parametric grounds (Python
    # + numpy/Pillow only) and Blender-driven vehicles/ways (a small
    # fixed sample) — and asserts no diff against the committed
    # siblings.  Same principle as `reemit-dats` below, different
    # backends.  Catches both render-pipeline drift and Cycles
    # non-determinism across CI runners.  See `Makefile` →
    # `bake-grounds` and `rebake-determinism-sample` for the asset
    # lists.  If only the Blender half flakes with byte-different
    # PNGs (cross-machine Cycles drift), the first pin to try is
    # `scene.render.threads_mode = 'FIXED'; threads = 1` in
    # `pak/render.py::_install_camera_and_sun` and
    # `pak/bake_way.py::_configure_render`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install numpy Pillow
      # `python3-numpy` lands numpy where apt-installed blender's
      # bundled Python looks for it (CLAUDE.md → "Running the bake
      # in a fresh sandbox").  The setup-python pip install above
      # is invisible to blender.
      - run: sudo apt-get install -y blender libegl1 python3-numpy
      - name: Re-run parametric ground bakers
        run: make bake-grounds
      - name: Re-render the Blender-driven determinism sample
        # One asset per pipeline shape: vehicle (pak/render.py
        # standard atlas, Cycles), way (pak/bake_way.py Workbench),
        # bridge (pak/bake.py per-piece render + stitch, EEVEE), and
        # the pilot building (pak/bake.py multi-season stitching via
        # _stitch_seasons, EEVEE).  res_1600_kg_01 is the asset the
        # building bake was calibrated against -- exercises both the
        # summer/winter blend pair and the materials/lighting tuned
        # path.  Add an entry when a new pipeline shape lands, not
        # before.
        run: |
          python3 -m trains._4wheel_1850s_first
          python3 -m ways.cssr
          python3 -m ways.plate_girder
          python3 -m citybuildings.res_1600_kg_01
      - name: Verify byte-identical output
        run: git diff --exit-code
      - name: Diagnose PNG drift (only on failure)
        # Cross-CI-runner Cycles non-determinism would surface here.
        # Prints CPU / blender / numpy / zlib info plus a per-PNG
        # pixel-or-encoding-only verdict via `pak/diag_png_drift.py`.
        if: failure()
        run: |
          echo "--- CPU ---"
          grep -m1 "^model name" /proc/cpuinfo
          grep -m1 "^flags" /proc/cpuinfo | tr ' ' '\n' | grep -E "^(sse|avx|amx)" | sort -u | tr '\n' ' '; echo
          echo "--- OS ---"
          grep -E "^(NAME|VERSION)=" /etc/os-release
          uname -a
          echo "--- Blender ---"
          blender --version 2>&1 | head -5
          echo "--- Python / numpy ---"
          python3 --version
          python3 -c "import numpy; print('numpy', numpy.__version__, numpy.__file__)"
          python3 -c "import zlib; print('zlib', zlib.ZLIB_VERSION, zlib.ZLIB_RUNTIME_VERSION)"
          echo "--- PNG diff ---"
          changed=$(git diff --name-only -- '*.png')
          if [ -z "$changed" ]; then
            echo "(no PNG drift -- failure is non-PNG)"
          else
            python3 -m pak.diag_png_drift $changed
          fi

  reemit-dats:
    # Catches drift between a bake script's SPEC and its committed
    # `.dat` sibling without re-rendering — vehicle bakes need Blender
    # + Cycles (minutes per asset), too heavy for every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Re-emit every vehicle bake unit's .dat from its SPEC
        run: python3 -m pak.reemit_dats
      - name: Verify byte-identical output
        run: git diff --exit-code -- '*.dat'
